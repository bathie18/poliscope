# PoliScope — squelette de déploiement de production (100 % open source).
# Les secrets sont lus dans .env (non versionné). Voir docs/deploiement.md.
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: poliscope
      POSTGRES_USER: poliscope
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?à définir dans .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../database:/schema:ro
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: start --hostname=${AUTH_HOSTNAME} --proxy-headers=xforwarded
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/poliscope
      KC_DB_USERNAME: poliscope
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?à définir dans .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?à définir dans .env}
    depends_on: [db]
    restart: unless-stopped

  api:
    build: ../api            # FastAPI (à développer, contrat : api/openapi.yaml)
    environment:
      DATABASE_URL: postgresql://poliscope:${POSTGRES_PASSWORD}@db:5432/poliscope
      OIDC_ISSUER: https://${AUTH_HOSTNAME}/realms/poliscope
      CIVICSCOPE_API_URL: ${CIVICSCOPE_API_URL}
      CIVICSCOPE_API_TOKEN: ${CIVICSCOPE_API_TOKEN}
      S3_ENDPOINT: http://minio:9000
    depends_on: [db, keycloak]
    restart: unless-stopped

  tiles:
    image: ghcr.io/maplibre/martin:v0.14.2
    command: --listen-addresses 0.0.0.0:3000
    environment:
      DATABASE_URL: postgresql://poliscope:${POSTGRES_PASSWORD}@db:5432/poliscope
    depends_on: [db]
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?à définir dans .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?à définir dans .env}
    volumes: [miniodata:/data]
    restart: unless-stopped

  web:
    image: nginx:1.27-alpine
    ports: ["80:80"]
    volumes:
      - ../:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [api, tiles]
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
