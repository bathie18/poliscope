server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  # TLS à terminer ici ou en amont (certificats Let's Encrypt)
  add_header X-Content-Type-Options nosniff;
  add_header Referrer-Policy same-origin;
  location /api/   { proxy_pass http://api:8000/;   proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
  location /tiles/ { proxy_pass http://tiles:3000/; }
  location ~ ^/(deploy|database|tools)/ { deny all; }
  location ~* \.geojson$ { types { application/geo+json geojson; } gzip on; gzip_types application/geo+json; }
}
